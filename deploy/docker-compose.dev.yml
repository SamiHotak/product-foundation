# Local development: everything runs in Docker. Start with `make dev`.
#
#   App (Next.js)      http://localhost:3000
#   API docs           http://localhost:8000/api/docs
#   Mailpit (emails)   http://localhost:8025
#   MinIO (files)      http://localhost:9001   user: minioadmin / pass: minioadmin
#
# Code folders are mounted, so saving a file reloads the backend, worker and frontend.
# Dev-only passwords below are fine locally. Production uses real secrets (phase 5).

name: foundation-dev

x-backend-env: &backend-env
  ENVIRONMENT: development
  LOG_FORMAT: console
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: '["http://localhost:3000"]'
  # Windows + Docker Desktop: file change events don't cross into containers, so poll.
  WATCHFILES_FORCE_POLLING: "true"

x-backend-base: &backend-base
  build:
    context: ../backend
    target: dev
  image: foundation-backend:dev
  environment: *backend-env
  volumes:
    - ../backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible file storage for local dev. Production uses Hetzner Object Storage.
  # Note: MinIO stopped publishing new free images in late 2025; the last published
  # image still works fine for local development.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the dev bucket once, then exits.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/foundation-dev
      "
    restart: "no"

  # Catches every email the app sends. Open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    <<: *backend-base
    # Apply migrations, then start the API with auto-reload.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    <<: *backend-base
    # watchfiles restarts the worker when Python code changes.
    command: >
      watchfiles --filter python
      "celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2"
      app

  beat:
    <<: *backend-base
    command: >
      celery -A app.workers.celery_app beat --loglevel=INFO
      --schedule /tmp/celerybeat-schedule

  frontend:
    build:
      context: ../frontend
      target: dev
    image: foundation-frontend:dev
    environment:
      API_INTERNAL_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      # Keep Linux node_modules and the build cache inside Docker, not on Windows.
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:

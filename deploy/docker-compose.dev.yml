# Local development: everything runs in Docker. Start with `make dev`.
#
#   App (Next.js)      http://localhost:3000
#   API docs           http://localhost:8000/api/docs
#   Mailpit (emails)   http://localhost:8025
#   S3 file storage    http://localhost:8333 (SeaweedFS; the app reaches it as /storage)
#
# `make e2e` also starts the `e2e` service (profile "e2e"): Playwright in Docker.
#
# Code folders are mounted, so saving a file reloads the backend, worker and frontend.
# Dev-only passwords below are fine locally. Production uses real secrets (phase 5).

name: foundation-dev

x-backend-env: &backend-env
  ENVIRONMENT: development
  LOG_FORMAT: console
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
  REDIS_URL: redis://redis:6379/0
  # Browser origins allowed to call the API with the session cookie.
  # frontend:3000 is how Playwright (make e2e) opens the app inside Docker.
  APP_NAME: Foundation # shown in emails; keep equal to name in frontend/config/product.ts
  APP_URL: http://localhost:3000
  CORS_ORIGINS: '["http://localhost:3000", "http://frontend:3000"]'
  # Emails go to Mailpit: open http://localhost:8025 to read them.
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  # Local only: the browser tests sign up many users from one IP. Production keeps 20/min.
  AUTH_REQUESTS_PER_MINUTE_PER_IP: "300"
  # Google sign-in and Stripe keys are NOT here: put them in backend/.env (never committed).
  # Billing: without STRIPE_SECRET_KEY the app uses a pretend checkout (local only). With a
  # Stripe TEST key in backend/.env it uses real Stripe test mode. See docs/BILLING.md.
  BILLING_DEV_TOOLS: "true"
  # File storage: SeaweedFS (the `s3` service below). Browsers upload through the Next.js
  # server (/storage -> s3:8333), so nothing else needs to be reachable. See docs/FILES_AND_AI.md.
  S3_ENDPOINT: http://s3:8333
  S3_PUBLIC_URL: /storage
  S3_BUCKET: foundation-files
  S3_ACCESS_KEY: dev-access-key
  S3_SECRET_KEY: dev-secret-key
  # AI: without OPENAI_API_KEY (in backend/.env) a pretend model answers (free, fixed
  # answers). With a key the real model is used. Langfuse keys also go in backend/.env.
  LLM_DEV_FAKE: "true"
  # "Try the demo" button on the login page (make seed creates the data; it resets nightly).
  DEMO_ENABLED: "true"
  # Windows + Docker Desktop: file change events don't cross into containers, so poll.
  WATCHFILES_FORCE_POLLING: "true"

x-backend-base: &backend-base
  build:
    context: ../backend
    target: dev
  image: foundation-backend:dev
  environment: *backend-env
  volumes:
    - ../backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    s3:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Catches every email the app sends. Open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Local S3 file storage: SeaweedFS "mini" (storage, filer and S3 API in one container).
  # MinIO stopped publishing Docker images in 2025, so we use SeaweedFS (Apache-2.0).
  # It creates the bucket on start. Production uses Hetzner Object Storage instead.
  s3:
    image: chrislusf/seaweedfs:4.47
    # externalUrl: download links are signed for http://s3:8333. They reach SeaweedFS through
    # the Next.js proxy (/storage), which adds X-Forwarded-Host; this tells SeaweedFS to check
    # signatures against s3:8333 first.
    command: ["mini", "-dir=/data", "-s3.externalUrl=http://s3:8333"]
    environment:
      AWS_ACCESS_KEY_ID: dev-access-key
      AWS_SECRET_ACCESS_KEY: dev-secret-key
      S3_BUCKET: foundation-files
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  backend:
    <<: *backend-base
    volumes:
      - ../backend:/app
      # `make api-client` writes the OpenAPI schema here for the frontend.
      - ../frontend/lib/api:/frontend-api
    # Apply migrations, then start the API with auto-reload.
    # --timeout-keep-alive 65: keep idle connections open longer than the Next.js proxy does
    # (~5 s). With equal timeouts the proxy sometimes reuses a connection uvicorn just closed,
    # and the browser gets a random 500 "socket hang up".
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
             --proxy-headers --forwarded-allow-ips='*' --timeout-keep-alive 65"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    <<: *backend-base
    # watchfiles restarts the worker when Python code changes.
    command: >
      watchfiles --filter python
      "celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2"
      app

  beat:
    <<: *backend-base
    command: >
      celery -A app.workers.celery_app beat --loglevel=INFO
      --schedule /tmp/celerybeat-schedule

  frontend:
    build:
      context: ../frontend
      target: dev
    image: foundation-frontend:dev
    environment:
      API_INTERNAL_URL: http://backend:8000
      # Where Next.js forwards /storage/... (file uploads and downloads, see next.config.ts).
      STORAGE_INTERNAL_URL: http://s3:8333
      # Public address of the website (sitemap.xml, robots.txt, link previews).
      APP_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      # Keep Linux node_modules and the build cache inside Docker, not on Windows.
      - /app/node_modules
      - /app/.next
    # Healthy = Next.js answers AND its /api proxy reaches FastAPI.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

  # Forwards Stripe TEST-mode webhooks to the backend (like Stripe will do in production).
  # Not started by `make dev`; run with `make stripe-listen`. Needs STRIPE_SECRET_KEY in
  # backend/.env. It prints a webhook secret (whsec_...): put it in backend/.env too.
  stripe-cli:
    profiles: ["stripe"]
    image: stripe/stripe-cli:latest
    env_file:
      - path: ../backend/.env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        stripe listen --api-key "$$STRIPE_SECRET_KEY"
        --forward-to http://backend:8000/api/billing/webhook
        --events checkout.session.completed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,customer.subscription.paused,customer.subscription.resumed,customer.subscription.trial_will_end,invoice.paid,invoice.payment_failed
    depends_on:
      backend:
        condition: service_healthy

  # End-to-end tests (Playwright). Not started by `make dev`; run with `make e2e`.
  e2e:
    profiles: ["e2e"]
    build:
      context: ../frontend
      target: e2e
    image: foundation-frontend:e2e
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:3000
      MAILPIT_URL: http://mailpit:8025
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ipc: host # Chromium needs more shared memory than Docker's default
    depends_on:
      frontend:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  postgres-data:
  s3-data:

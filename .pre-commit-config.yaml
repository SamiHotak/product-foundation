# Checks that run on `git commit` (only on the files you changed).
# One-time setup (needs Python on Windows):  pip install pre-commit==4.6.2
#                                            pre-commit install
# Run on everything:                          pre-commit run --all-files
# CI runs the same hooks, so a commit that skips them still gets checked.
#
# Frontend checks (eslint, prettier, typecheck) run in CI and with `make lint`,
# so you don't need Node installed on Windows.

exclude: ^frontend/lib/api/(openapi\.json|schema\.d\.ts)$ # generated by `make api-client`

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig\.json$ # tsconfig allows comments
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8 # keep equal to ruff in backend/requirements-dev.txt
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

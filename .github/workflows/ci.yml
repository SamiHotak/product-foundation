# CI: runs on every push and pull request. All jobs must be green before a phase is done.
#
#   hygiene   pre-commit hooks (whitespace, YAML/JSON, private keys, ruff)
#   backend   ruff, mypy, migrations (up, check, down, up), pytest with real Postgres + Redis,
#             and "is the committed OpenAPI schema up to date?"
#   frontend  typed client up to date, eslint, typecheck, prettier, next build
#   e2e       the full dev stack in Docker (same as `make dev`) + Playwright in Docker

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit==4.6.2
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --all-files --show-diff-on-failure

  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: test
      LOG_FORMAT: json
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy app tests
      - name: Migrations apply
        run: alembic upgrade head
      - name: Models match migrations
        run: alembic check
      - name: Migrations can be reverted and re-applied
        run: alembic downgrade base && alembic upgrade head
      - name: Tests (unit + integration) with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: OpenAPI schema is up to date (run `make api-client` if this fails)
        run: |
          python -m app.scripts.export_openapi --out /tmp/openapi.json
          diff -u ../frontend/lib/api/openapi.json /tmp/openapi.json

  frontend:
    name: Frontend (client, lint, types, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typed API client is up to date (run `make api-client` if this fails)
        run: |
          npm run api:generate
          git diff --exit-code -- lib/api
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Prettier
        run: npm run format:check
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright on the full stack)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -f deploy/docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack (same as `make dev`)
        run: $COMPOSE up -d --build --wait --wait-timeout 400
      - name: Run Playwright (same as `make e2e`)
        run: $COMPOSE --profile e2e run --rm --build e2e
      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color --tail=200
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: $COMPOSE --profile e2e down -v --remove-orphans
